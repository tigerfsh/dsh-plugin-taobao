# Bundle patch for @fushouhai/dsh-plugin-taobao: mounts the model-facing Taobao tools over the
# profile root.
#
# No machine-specific config is needed. The browser engine ships inside this package
# (`lib/engine.mjs` + `lib/cli.mjs`), so `cliPath` defaults to it, and login state defaults to
# `$DSH_HOME/taobao` — outside the package, so reinstalling never touches a live login.
# Override `dataDir` / `qrBaseUrl` / `cliTimeoutMs` from your own profile patch layer if needed.
#
# Exactly one layer may declare this row: the loader throws
# `duplicate loader entry id: tool-taobao` at boot, so if you mount it by hand from
# `$DSH_HOME/profiles/<profile>/cordis.patch.yml`, do NOT also list this package under
# `dsh.profile.bundles`.

- insert:
    - id: tool-taobao
      name: '@fushouhai/dsh-plugin-taobao'
